name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Lint y Type Check
  # ============================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Desktop (Tauri) needs Rust + webkit; it is checked in build-tauri
      - name: Type check
        run: bun run --filter '!@abbacchio/desktop' build

  # ============================================
  # Oxlint (the anti-slop plugin is TypeScript, which needs Node >= 22.12)
  # ============================================
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  # ============================================
  # Build packages npm
  # ============================================
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build transport
        run: bun run --filter @abbacchio/transport build

      - name: Build browser-transport
        run: bun run --filter @abbacchio/browser-transport build

      - name: Build API
        run: bun run --filter @abbacchio/api build

      - name: Build Dashboard
        run: bun run --filter @abbacchio/dashboard build

  # ============================================
  # Performance vs the base branch (abbacchio bench)
  # Report-only for now: a regression adds a warning and the table to the
  # job summary but does not fail the job, until runner noise is known.
  # ============================================
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the baseline is checked out from origin/<base> in a worktree

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compare API performance with ${{ github.base_ref }}
        run: |
          set +e
          bun packages/api/src/cli.ts bench \
            --baseline "origin/${{ github.base_ref }}" \
            --setup "bun install --frozen-lockfile" \
            --run "bun $GITHUB_WORKSPACE/packages/api/bench/load.ts" \
            --runs 3 \
            --format markdown > perf.md
          code=$?
          set -e
          cat perf.md                       # in the log too, not only the summary
          cat perf.md >> "$GITHUB_STEP_SUMMARY"
          regressed=$(grep '🔴' perf.md | cut -d'|' -f2 | sed 's/^ *//; s/ *$//' | paste -sd ',' - | sed 's/,/, /g')
          case $code in
            0) echo "No performance regressions." ;;
            1) echo "::warning title=Performance::Possible regression vs ${{ github.base_ref }}: ${regressed}. See the job summary." ;;
            3) echo "::warning title=Performance::Not enough data to compare; see the job summary." ;;
            *) echo "::error title=Performance::abbacchio bench failed (exit $code)"; exit "$code" ;;
          esac

  # ============================================
  # Build Tauri (solo verificar que compila)
  # ============================================
  build-tauri:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            pkg-config \
            patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          shared-key: tauri-linux-v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri (dev check)
        run: |
          cd packages/desktop
          bun run tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
