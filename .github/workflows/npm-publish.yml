name: Publish npm Packages

on:
  push:
    tags:
      - 'v*'  # Se dispara con el mismo tag que desktop
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (api = the `abbacchio` package)'
        required: true
        type: choice
        options:
          - all
          - transport
          - browser-transport
          - tui
          - api
        default: all
      dry_run:
        description: 'Dry run (no publish)'
        type: boolean
        default: false

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: transport
            filter: '@abbacchio/transport'
          - name: browser-transport
            filter: '@abbacchio/browser-transport'
          - name: tui
            filter: '@abbacchio/tui'
          - name: api              # directory packages/api, published as `abbacchio`
            filter: 'abbacchio'

    name: Publish ${{ matrix.package.name }}

    steps:
      # A manual run publishes only the selected package (or all); a tag push publishes all.
      - name: Select package
        id: select
        env:
          SELECTED: ${{ github.event.inputs.package }}
          PACKAGE: ${{ matrix.package.name }}
        run: |
          if [ -z "$SELECTED" ] || [ "$SELECTED" = all ] || [ "$SELECTED" = "$PACKAGE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $PACKAGE (selected: $SELECTED)"
          fi

      - uses: actions/checkout@v4
        if: steps.select.outputs.run == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.select.outputs.run == 'true'
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        if: steps.select.outputs.run == 'true'
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # The API package ships the built dashboard inside dist/dashboard
      - name: Build dashboard
        if: steps.select.outputs.run == 'true' && matrix.package.name == 'api'
        run: bun run --filter @abbacchio/dashboard build

      - name: Build package
        if: steps.select.outputs.run == 'true'
        run: bun run --filter ${{ matrix.package.filter }} build

      - name: Check if version exists on npm
        if: steps.select.outputs.run == 'true'
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/${{ matrix.package.name }}/package.json').version")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          if npm view ${{ matrix.package.filter }}@$PACKAGE_VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION already exists on npm, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION does not exist, will publish..."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.select.outputs.run == 'true' && steps.check.outputs.exists == 'false' && github.event.inputs.dry_run != 'true'
        working-directory: packages/${{ matrix.package.name }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: steps.select.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        working-directory: packages/${{ matrix.package.name }}
        run: npm publish --access public --dry-run

      - name: Summary
        if: steps.select.outputs.run == 'true'
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "### ${{ matrix.package.filter }} - Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Version ${{ steps.check.outputs.version }} already exists on npm" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ${{ matrix.package.filter }} - Published" >> $GITHUB_STEP_SUMMARY
            echo "Version ${{ steps.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
